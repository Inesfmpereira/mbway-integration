<!DOCTYPE html>
<html>
<head>
    <title>Pagamento com MB WAY</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { background: #5469d4; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #4356c7; }
    </style>
</head>
<body>
    <h1>Teste de Pagamento MB WAY</h1>
    <p>Produto: Exemplo - €1.00</p>
    <button onclick="createCheckoutSession()">Pagar com Stripe (MB WAY disponível)</button>

    <script>
        async function createCheckoutSession() {
            const response = await fetch('/create-checkout-session', {
                method: 'POST',
            });
            const session = await response.json();
            
            if (session.url) {
                window.location = session.url;
            } else {
                alert('Erro ao criar sessão de pagamento');
            }
        }
    </script>
</body>
</html>
